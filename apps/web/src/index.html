<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>HIPMaster</title>
    <base href="/" />
    <!-- viewport-fit=cover : la barre d'onglets tient compte de la zone de sécurité des téléphones à encoche (US-060). -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Thème clair ou sombre dès le premier affichage, avant même la feuille de style (ADR 0012). -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Jeu de cartes à collectionner : ouvre des boosters, complète ta collection, défie tes amis."
    />
    <!-- Site réservé aux invités : aucun moteur de recherche ne l'indexe (US-050, avec robots.txt). -->
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="flex min-h-screen flex-col bg-fond text-texte">
    <!-- Remplacé par le jeu dès qu'il démarre (US-055). Ni style ni script en ligne : la CSP les interdit (US-050). -->
    <hip-root>
      <p class="mx-auto w-full max-w-3xl px-6 py-24 text-lg noscript:hidden">
        Chargement de HIPMaster…
      </p>
    </hip-root>
    <noscript>
      <p class="mx-auto w-full max-w-3xl px-6 py-24 text-lg">
        HIPMaster a besoin de JavaScript : activez-le dans votre navigateur pour jouer.
      </p>
    </noscript>
  </body>
</html>
