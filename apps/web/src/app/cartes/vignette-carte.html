@let c = carte();
<article
  class="halo-carte relative flex aspect-[5/7] flex-col gap-[2.5cqw] overflow-hidden rounded-[6cqw] border-[1.5cqw] border-cadre bg-fond-carte p-[4cqw] text-texte transition-transform has-[a:focus-visible]:outline-3 has-[a:focus-visible]:outline-offset-2 has-[a:focus-visible]:outline-accent motion-safe:has-[a]:hover:-translate-y-1"
  [class]="'cadre-' + c.rarete"
>
  <div class="flex items-center justify-between gap-[2cqw] text-[max(10px,5cqw)] font-semibold">
    <span>{{ libelleRarete() }}</span>
    <span class="flex items-center gap-[1cqw]">
      <hip-icone nom="debit" class="size-[max(12px,6cqw)] text-amber-600 dark:text-amber-400" />
      <span class="sr-only">Débit </span>{{ c.cout }}
    </span>
  </div>

  <div
    class="flex min-h-[18%] flex-1 items-center justify-center rounded-[3cqw] bg-linear-to-br text-white/90"
    [class]="illustration()"
    aria-hidden="true"
  >
    <hip-icone [nom]="c.famille" class="size-[22cqw]" />
  </div>

  <div class="flex flex-col gap-[1cqw]">
    @if (titre()) {
      <h2 class="text-[max(13px,8cqw)] leading-tight font-bold">
        @if (lien(); as l) {
          <a [routerLink]="l" class="after:absolute after:inset-0 focus-visible:outline-none">{{
            c.nom
          }}</a>
        } @else {
          {{ c.nom }}
        }
      </h2>
    } @else {
      <p class="text-[max(13px,8cqw)] leading-tight font-bold">{{ c.nom }}</p>
    }
    <p class="text-[max(10px,4.5cqw)] text-texte-doux">{{ sousTitre() }}</p>
    @if (texte()) {
      <p class="line-clamp-3 text-[max(10px,5cqw)] leading-snug">{{ texte() }}</p>
    }
  </div>

  @if (c.attaque !== undefined) {
    <div
      class="mt-auto flex items-center justify-between border-t border-bordure pt-[2cqw] text-[max(12px,7.5cqw)] font-bold"
    >
      <span class="flex items-center gap-[1.5cqw]">
        <hip-icone nom="attaque" class="size-[max(14px,7cqw)] text-red-600 dark:text-red-400" />
        <span class="sr-only">Attaque </span>{{ c.attaque }}
      </span>
      <span class="flex items-center gap-[1.5cqw]">
        <hip-icone nom="pv" class="size-[max(14px,7cqw)] text-blue-600 dark:text-blue-400" />
        <span class="sr-only">PV </span>{{ c.pv }}
      </span>
    </div>
  }
</article>
