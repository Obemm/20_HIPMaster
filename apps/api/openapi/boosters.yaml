openapi: 3.1.0
info:
  title: HIPMaster — boosters
  version: 1.0.0
  description: >
    Boosters du joueur connecté (US-023, ADR 0019). Cinq boosters sont offerts à la création du compte, puis un
    booster gratuit s'ajoute toutes les 10 minutes, jusqu'à un plafond de 10. Le serveur tire les cartes ; elles
    rejoignent la collection du joueur. Compte requis (`Authorization: Bearer <jeton>`, voir comptes.yaml).

    Des boosters peuvent aussi être offerts par code (US-070, ADR 0045) : le porteur du projet récompense une réussite
    de l'équipe par un code, que chaque joueur utilise une fois.
servers:
  - url: /api/v1
security: [{ jeton: [] }]
paths:
  /moi/boosters:
    get:
      operationId: lireBoosters
      summary: Le stock de boosters, recharges comprises
      responses:
        '200':
          description: Le stock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Boosters' }
        '401': { $ref: '#/components/responses/Probleme' }
  /moi/boosters/ouvertures:
    post:
      operationId: ouvrirBooster
      summary: Ouvre un booster et ajoute ses 5 cartes à la collection
      responses:
        '201':
          description: Les cartes tirées et le stock restant.
          content:
            application/json:
              schema:
                type: object
                required: [cartes, boosters]
                properties:
                  cartes:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items:
                      type: object
                      required: [numero, nouvelle]
                      properties:
                        numero:
                          {
                            type: integer,
                            description: Numéro de la carte dans le catalogue (cartes.yaml).,
                          }
                        nouvelle:
                          type: boolean
                          description: Première fois que le joueur obtient cette carte.
                  boosters: { $ref: '#/components/schemas/Boosters' }
        '401': { $ref: '#/components/responses/Probleme' }
        '409':
          description: Aucun booster en stock (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
  /moi/boosters/codes:
    post:
      operationId: utiliserCodeBoosters
      summary: Utilise un code de boosters et reçoit les boosters qu'il offre
      description: >
        Les boosters reçus s'ajoutent au stock, quitte à dépasser le plafond de recharge (ADR 0019). Chaque joueur
        n'utilise un code qu'une fois. Limite de débit (ADR 0025) : 60 essais par heure et par adresse (valeur de
        production, multipliée par le réglage `LIMITES_DEBIT`), au-delà de quoi la réponse est 429 avec `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  minLength: 1
                  maxLength: 64
                  description: Le code transmis, sans tenir compte de la casse, des espaces ni des tirets.
                  examples: [ABCD-EFGH-JKLM-NPQR]
      responses:
        '201':
          description: Les boosters reçus et le stock après réception.
          content:
            application/json:
              schema:
                type: object
                required: [libelle, offerts, boosters]
                properties:
                  libelle:
                    type: string
                    description: La réussite récompensée.
                    examples: [1re API publiée]
                  offerts: { type: integer, minimum: 1, description: Boosters reçus. }
                  boosters: { $ref: '#/components/schemas/Boosters' }
        '400': { $ref: '#/components/responses/Probleme' }
        '401': { $ref: '#/components/responses/Probleme' }
        '403':
          description: >
            Code refusé, avec un seul message : inconnu, expiré, révoqué, épuisé ou déjà utilisé par ce joueur, sans dire
            lequel. Rien n'est consommé.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '429':
          description: Limite de débit dépassée pour cette adresse (Problem Details, en-tête `Retry-After`).
          headers:
            Retry-After:
              description: Secondes à attendre avant de réessayer.
              schema: { type: integer, minimum: 0 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
components:
  securitySchemes:
    jeton:
      type: http
      scheme: bearer
  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
  schemas:
    Probleme:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          description: >
            Code stable de l'erreur (US-082), que le client traduit ; `title` (en français) sert de repli. Pour une action
            refusée, le code du moteur (`debit-insuffisant`, `garde`…).
    Boosters:
      type: object
      required: [stock, plafond, prochainDans]
      properties:
        stock: { type: integer, minimum: 0 }
        plafond: { type: integer }
        prochainDans:
          type: [integer, 'null']
          description: Secondes avant le prochain booster gratuit ; null quand le stock est plein.
