openapi: 3.1.0
info:
  title: HIPMaster — boosters
  version: 1.0.0
  description: >
    Boosters du joueur connecté (US-023, ADR 0019). Cinq boosters sont offerts à la création du compte, puis un
    booster gratuit s'ajoute toutes les 10 minutes, jusqu'à un plafond de 10. Le serveur tire les cartes ; elles
    rejoignent la collection du joueur. Compte requis (`Authorization: Bearer <jeton>`, voir comptes.yaml).
servers:
  - url: /api/v1
security: [{ jeton: [] }]
paths:
  /moi/boosters:
    get:
      operationId: lireBoosters
      summary: Le stock de boosters, recharges comprises
      responses:
        '200':
          description: Le stock.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Boosters' }
        '401': { $ref: '#/components/responses/Probleme' }
  /moi/boosters/ouvertures:
    post:
      operationId: ouvrirBooster
      summary: Ouvre un booster et ajoute ses 5 cartes à la collection
      responses:
        '201':
          description: Les cartes tirées et le stock restant.
          content:
            application/json:
              schema:
                type: object
                required: [cartes, boosters]
                properties:
                  cartes:
                    type: array
                    minItems: 5
                    maxItems: 5
                    items:
                      type: object
                      required: [numero, nouvelle]
                      properties:
                        numero:
                          {
                            type: integer,
                            description: Numéro de la carte dans le catalogue (cartes.yaml).,
                          }
                        nouvelle:
                          type: boolean
                          description: Première fois que le joueur obtient cette carte.
                  boosters: { $ref: '#/components/schemas/Boosters' }
        '401': { $ref: '#/components/responses/Probleme' }
        '409':
          description: Aucun booster en stock (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
components:
  securitySchemes:
    jeton:
      type: http
      scheme: bearer
  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
  schemas:
    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
    Boosters:
      type: object
      required: [stock, plafond, prochainDans]
      properties:
        stock: { type: integer, minimum: 0 }
        plafond: { type: integer }
        prochainDans:
          type: [integer, 'null']
          description: Secondes avant le prochain booster gratuit ; null quand le stock est plein.
