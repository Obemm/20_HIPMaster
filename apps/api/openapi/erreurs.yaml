openapi: 3.1.0
info:
  title: HIPMaster — erreurs des navigateurs
  version: 1.0.0
  description: >
    Le front y signale ses erreurs JavaScript non gérées (US-051), qui rejoignent celles de l'API dans Error Reporting
    (service `hipmaster-web`). Aucun compte n'est demandé, et rien n'identifie le joueur : ni jeton, ni pseudo, ni
    paramètres de l'adresse de la page.

    Protections (ADR 0025) : 30 erreurs par heure et par adresse IP (multipliées par le réglage `LIMITES_DEBIT` de
    l'API) ; au-delà, 429 avec `Retry-After`. Le front n'en envoie lui-même que 5 au plus par chargement de page.
servers:
  - url: /api/v1
paths:
  /erreurs:
    post:
      operationId: signalerErreur
      summary: Signale une erreur JavaScript non gérée du navigateur
      description: 'Limite : 30 erreurs par heure et par adresse.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErreurNavigateur' }
      responses:
        '204': { description: Erreur journalisée pour Error Reporting. }
        '400': { $ref: '#/components/responses/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
components:
  headers:
    RetryAfter:
      description: Secondes à attendre avant de réessayer.
      schema: { type: integer, minimum: 0 }
    LimiteMax:
      description: Requêtes acceptées par fenêtre, pour cette route et cette adresse.
      schema: { type: integer }
    LimiteRestante:
      description: Requêtes encore acceptées dans la fenêtre en cours.
      schema: { type: integer }
    LimiteRemiseAZero:
      description: Secondes avant la fenêtre suivante.
      schema: { type: integer }
  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TropDeRequetes:
      description: >
        Limite de débit dépassée pour cette adresse (ADR 0025) : réessayer après le délai de `Retry-After`.
      headers:
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
        X-RateLimit-Limit: { $ref: '#/components/headers/LimiteMax' }
        X-RateLimit-Remaining: { $ref: '#/components/headers/LimiteRestante' }
        X-RateLimit-Reset: { $ref: '#/components/headers/LimiteRemiseAZero' }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
  schemas:
    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
    ErreurNavigateur:
      type: object
      required: [message, page, version]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 500
          description: Le message de l'erreur.
        page:
          type: string
          maxLength: 200
          pattern: '^/[^?#\s]*$'
          description: Le chemin de la page, sans paramètres ni fragment (le lien d'invitation porte son code en paramètre).
        version:
          type: string
          maxLength: 40
          pattern: '^[\w.-]+$'
          description: Le nom du script principal du build (`main-XXXXXXXX`), qui désigne la version publiée.
        pile:
          type: string
          maxLength: 4000
          description: La pile d'appels, telle que le navigateur la donne (scripts minifiés, sans source maps).
