openapi: 3.1.0
info:
  title: HIPMaster — catalogue des cartes
  version: 1.2.0
  description: >
    Catalogue en lecture seule des cartes du set 1 (US-008, ADR 0011). Les cartes sont des données versionnées du
    domaine : aucune écriture n'est exposée. Le détail d'une carte porte en plus sa fiche « En savoir plus »
    (US-073, ADR 0036), absente de la liste pour la garder légère.

    Cache HTTP (US-057, ADR 0039) : toute réponse réussie du catalogue (ici, et `GET /decks`, `GET /niveaux` du
    contrat des parties) part en `Cache-Control: public, max-age=300` avec un `ETag` commun, l'empreinte du catalogue
    servi ; avec cet `ETag` en `If-None-Match`, la réponse est 304 sans corps. Les erreurs restent en `no-store`.
    Une réponse de plus de 1 Ko est compressée (Brotli ou gzip) si le client l'accepte (`Accept-Encoding`).
servers:
  - url: /api/v1
paths:
  /cartes:
    get:
      operationId: listerCartes
      summary: Liste toutes les cartes, triées par numéro, sans leur fiche
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Les cartes du set 1.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheCatalogue' }
            ETag: { $ref: '#/components/headers/EtagCatalogue' }
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Carte' }
        '304': { $ref: '#/components/responses/NonModifie' }
  /cartes/{numero}:
    get:
      operationId: lireCarte
      summary: Lit une carte par son numéro, avec sa fiche « En savoir plus »
      parameters:
        - name: numero
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: La carte demandée.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheCatalogue' }
            ETag: { $ref: '#/components/headers/EtagCatalogue' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CarteDetaillee' }
        '304': { $ref: '#/components/responses/NonModifie' }
        '400':
          description: Numéro invalide.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '404':
          description: Aucune carte ne porte ce numéro.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
  /raretes:
    get:
      operationId: listerRaretes
      summary: Chances de chaque rareté dans un booster, calculées par le domaine
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Une chance par rareté, de la plus commune à la plus rare.
          headers:
            Cache-Control: { $ref: '#/components/headers/CacheCatalogue' }
            ETag: { $ref: '#/components/headers/EtagCatalogue' }
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [rarete, chance]
                  properties:
                    rarete: { type: string, enum: [commune, rare, epique, legendaire] }
                    chance: { type: number, minimum: 0, maximum: 1 }
        '304': { $ref: '#/components/responses/NonModifie' }
components:
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: L'`ETag` d'une réponse précédente du catalogue ; 304 sans corps s'il n'a pas changé.
      schema: { type: string }
  headers:
    CacheCatalogue:
      description: Le catalogue peut rester 5 minutes en cache, navigateur et relais compris.
      schema: { type: string, const: 'public, max-age=300' }
    EtagCatalogue:
      description: Empreinte du catalogue servi, commune à toutes ses routes ; elle change avec le catalogue.
      schema: { type: string, examples: ['"Xb3r1JqZ0aLm9QwE"'] }
  responses:
    NonModifie:
      description: Le catalogue n'a pas changé depuis l'`ETag` fourni ; réponse sans corps.
      headers:
        Cache-Control: { $ref: '#/components/headers/CacheCatalogue' }
        ETag: { $ref: '#/components/headers/EtagCatalogue' }
  schemas:
    Carte:
      type: object
      required: [numero, nom, famille, type, rarete, cout, capacites, enVrai]
      properties:
        numero: { type: integer, minimum: 1, description: Identifiant stable, jamais renuméroté. }
        nom: { type: string }
        famille:
          type: string
          enum: [fichiers, esb, api, ipaas, eda, ia, patterns, bestiaire]
        type:
          type: string
          enum: [composant, evolution, sort, incident]
        rarete:
          type: string
          enum: [commune, rare, epique, legendaire]
        cout: { type: integer, minimum: 0, maximum: 10, description: Coût en Débit. }
        attaque: { type: integer, minimum: 0, description: Composants et évolutions uniquement. }
        pv: { type: integer, minimum: 1, description: Composants et évolutions uniquement. }
        origine:
          type: integer
          description: Évolutions uniquement — numéro de la carte d'origine.
        ia: { type: boolean, description: Incidents uniquement — incident IA. }
        capacites:
          type: array
          items: { $ref: '#/components/schemas/Capacite' }
        effet: { type: string, description: Effet propre à la carte, s'il y en a un. }
        enVrai: { type: string, description: Explication pédagogique. }
    CarteDetaillee:
      description: Une carte, avec sa fiche « En savoir plus » quand elle est rédigée.
      allOf:
        - $ref: '#/components/schemas/Carte'
        - type: object
          properties:
            fiche: { $ref: '#/components/schemas/Fiche' }
    Fiche:
      type: object
      description: >
        Fiche « En savoir plus » (US-073, ADR 0036) : se lit en moins d'une minute, avec des ressources externes.
      required: [definition, usage, exemple, aRetenir, liens]
      properties:
        definition: { type: string, maxLength: 220, description: Ce que c'est, en une phrase. }
        usage:
          type: string
          maxLength: 360
          description: À quoi ça sert ; pour un incident, comment il survient.
        exemple: { type: string, maxLength: 360, description: Un exemple concret. }
        aRetenir:
          { type: string, maxLength: 320, description: Le piège à éviter ou la bonne pratique. }
        chezElis:
          type: string
          maxLength: 240
          description: Le lien avec l'intégration chez Elis, quand il est public et établi.
        liens:
          type: array
          minItems: 1
          maxItems: 3
          items: { $ref: '#/components/schemas/LienExterne' }
    LienExterne:
      type: object
      required: [titre, url, langue]
      properties:
        titre: { type: string }
        url:
          {
            type: string,
            format: uri,
            pattern: '^https://',
            description: Ressource externe,
            en https.,
          }
        langue: { type: string, enum: [fr, en], description: Langue de la ressource. }
    Capacite:
      type: object
      required: [id, nom, description]
      properties:
        id: { type: string, examples: [garde, connecteur] }
        nom: { type: string, examples: ['Connecteur (2)'] }
        description: { type: string }
        valeur: { type: integer, description: Valeur de la capacité (Connecteur). }
    Probleme:
      type: object
      description: Problem Details (RFC 9457).
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
