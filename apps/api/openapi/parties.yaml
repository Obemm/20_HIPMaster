openapi: 3.1.0
info:
  title: HIPMaster — parties contre le bot
  version: 1.5.0
  description: >
    Parties contre le bot (US-012), à quatre niveaux (US-021, US-064). Le serveur fait foi : il applique les règles (moteur du domaine,
    ADR 0013), fait jouer le bot et ne renvoie que la vue du joueur. Les parties en cours sont gardées en base
    (US-052, ADR 0030) : elles survivent aux redémarrages de l'API, et expirent après 24 heures sans coup joué (la
    création ou une action ; une lecture ne compte pas). Le joueur est toujours `j1`, le bot `j2`.

    Chaque partie a une `version`, donnée aussi en `ETag`, qui change à chaque action. Deux actions simultanées sur
    une même partie : une seule est appliquée, l'autre reçoit 409.

    Une partie créée avec le jeton d'un compte appartient à cette session : elle ne se lit et ne se joue qu'avec le
    même jeton, et reste introuvable (404) pour toute autre requête (US-047). Une partie sans compte appartient à qui
    connaît son identifiant.

    Un conseil (US-066, ADR 0039) dit au joueur le meilleur coup du moment, et pourquoi. Il n'existe que contre le
    bot : aucune route de conseil pour les duels entre joueurs.

    Protections (ADR 0025) : création, actions et conseils limités par adresse IP (valeurs de production ci-dessous,
    multipliées par le réglage `LIMITES_DEBIT` de l'API), 429 avec `Retry-After` au-delà ; réponses en
    `Cache-Control: no-store` ; corps de 16 Ko au plus (413).
servers:
  - url: /api/v1
paths:
  /decks:
    get:
      operationId: listerDecks
      summary: Liste les decks prêtés
      responses:
        '200':
          description: Les decks prêtés, jouables contre le bot.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Deck' }
  /niveaux:
    get:
      operationId: listerNiveaux
      summary: Liste les niveaux du bot, du plus simple au plus fort (US-021)
      responses:
        '200':
          description: Les niveaux du bot.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom, description]
                  properties:
                    id: { type: string, examples: [architecte-esb] }
                    nom: { type: string }
                    description: { type: string }
  /parties:
    post:
      operationId: creerPartie
      summary: Crée une partie contre le bot avec un deck prêté
      description: >
        Si le bot commence, son premier tour est déjà joué dans la réponse. Au-delà de 1 000 parties gardées, la
        création supprime la partie sans compte la moins récemment jouée, et seulement à défaut celle d'un compte
        (ADR 0025, 0030). Avec l'en-tête `Authorization: Bearer`
        d'un compte (facultatif), une victoire rapportera un booster (US-025, voir `recompense`), et la partie
        n'appartient qu'à cette session. Avec `guidee: true`, la partie guidée (US-067, ADR 0041) : decks
        d'initiation et graine fixes contre Stagiaire, `deck` et `niveau` ignorés, aucune récompense ; chaque réponse
        porte alors l'étape `guide` du moment. Limite : 20 créations par minute et par adresse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                deck:
                  type: string
                  description: Deck prêté (voir /decks) ; obligatoire, sauf pour la partie guidée.
                  examples: [moderne]
                guidee:
                  type: boolean
                  description: La première partie guidée (US-067) ; `false` par défaut.
                niveau:
                  type: string
                  description: Niveau du bot (voir /niveaux) ; `stagiaire`, le plus facile, par défaut (US-064).
                  examples: [agent-autonome]
      responses:
        '201':
          description: La partie créée.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partie' }
        '400': { $ref: '#/components/responses/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '422': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /parties/{id}:
    get:
      operationId: lirePartie
      summary: Lit la vue du joueur ; `evenements` contient tout le journal visible
      description: >
        Une partie lancée par un compte ne se lit qu'avec le jeton de la session qui l'a créée.
      parameters: [{ $ref: '#/components/parameters/IdPartie' }]
      responses:
        '200':
          description: La partie.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partie' }
        '404':
          description: Partie inconnue, expirée, ou appartenant à une autre session (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
  /parties/{id}/actions:
    post:
      operationId: jouerAction
      summary: Joue une action du joueur
      description: >
        Après `finirTour`, le bot joue tout son tour dans la même requête. `evenements` ne contient que ce qui s'est
        passé pendant la requête (action du joueur, puis tour du bot), écrits ensemble en une seule fois. Avec
        `If-Match` égal à l'ETag connu, l'action est refusée (409) si la partie a changé entre-temps (un double clic
        sur « Finir le tour », par exemple) ; sans lui, une action qui croise une autre action sur la même partie
        reçoit aussi 409. Une partie lancée par un compte ne se joue qu'avec le jeton de la session qui l'a créée.
        Limite : 300 actions par minute et par adresse.
      parameters:
        - { $ref: '#/components/parameters/IdPartie' }
        - name: If-Match
          in: header
          required: false
          description: L'ETag de la dernière réponse reçue pour cette partie.
          schema: { type: string, examples: ['"3"'] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Action' }
      responses:
        '200':
          description: La partie après l'action.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Partie' }
        '400': { $ref: '#/components/responses/Probleme' }
        '404':
          description: Partie inconnue, expirée, ou appartenant à une autre session (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '409':
          description: >
            La partie a changé depuis la version attendue (`If-Match`), ou une autre action est passée en même
            temps : rien n'est appliqué, relire la partie (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '422':
          description: Action refusée par les règles (`code` en donne la raison).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /parties/{id}/conseil:
    get:
      operationId: lireConseil
      summary: Le meilleur coup du moment, et pourquoi (US-066)
      description: >
        Calculé par le serveur à partir de la seule vue du joueur (ADR 0004, 0039) : il ne révèle ni la main ni la
        pioche du bot. L'action conseillée est toujours une des `vue.actions` ; le conseil ne joue rien, et ne change
        pas la récompense de victoire. Les duels n'ont pas de conseil. Même propriété que la partie (US-047). Limite :
        300 conseils par minute et par adresse.
      parameters: [{ $ref: '#/components/parameters/IdPartie' }]
      responses:
        '200':
          description: Le conseil, pour la version de la partie donnée en `ETag`.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conseil' }
        '404':
          description: Partie inconnue, expirée, ou appartenant à une autre session (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '409':
          description: Ce n'est pas au joueur de jouer, ou la partie est terminée (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
components:
  parameters:
    IdPartie:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Version de la partie, entre guillemets ; elle change à chaque action.
      schema: { type: string, examples: ['"3"'] }
  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TropDeRequetes: { $ref: 'comptes.yaml#/components/responses/TropDeRequetes' }
  schemas:
    Deck:
      type: object
      required: [id, nom, description, cartes]
      properties:
        id: { type: string }
        nom: { type: string }
        description: { type: string }
        cartes: { type: array, items: { type: integer }, description: Numéros des 20 cartes. }
    Partie:
      type: object
      required: [id, version, deck, deckAdversaire, niveau, vue, evenements]
      properties:
        id: { type: string, format: uuid }
        version:
          type: integer
          description: Change à chaque action ; à renvoyer dans `If-Match` (voir l'en-tête `ETag`).
        deck: { type: string, description: Identifiant du deck du joueur. }
        deckAdversaire: { type: string, description: Identifiant du deck du bot. }
        niveau: { type: string, description: Niveau du bot adverse. }
        vue: { $ref: '#/components/schemas/Vue' }
        evenements:
          type: array
          description: Événements visibles par le joueur (voir `Evenement`).
          items: { $ref: '#/components/schemas/Evenement' }
        recompense:
          type: object
          description: >
            Présente quand le joueur a gagné une partie lancée en étant connecté (en-tête `Authorization: Bearer`
            lors de sa création, voir comptes.yaml) : un booster, au plus 3 par jour UTC, une seule fois par partie
            (US-025).
          required: [booster, plafondAtteint, motif]
          properties:
            booster: { type: boolean, description: La victoire a rapporté un booster. }
            plafondAtteint: { type: boolean, description: Le plafond quotidien était déjà atteint. }
            motif:
              type: [string, 'null']
              enum: [plafond, adversaire-deja-affronte, null]
              description: Sans booster, pourquoi (« adversaire-deja-affronte » ne concerne que les duels, US-038).
        guide:
          type: object
          description: >
            Partie guidée seulement (US-067) : l'étape du moment. L'étape `etape` attend la `etape`-ième action du
            joueur (la version de la partie) ; la dernière, sans `attendu`, le laisse jouer jusqu'à la fin.
          required: [etape, total, titre, texte, attendu]
          properties:
            etape: { type: integer, description: "Numéro de l'étape, à partir de 0." }
            total: { type: integer, description: Nombre d'étapes, la dernière comprise. }
            titre: { type: string }
            texte: { type: string }
            attendu:
              description: L'action attendue du joueur ; `null` quand il joue librement.
              oneOf:
                - { $ref: '#/components/schemas/Action' }
                - { type: 'null' }
    Vue:
      type: object
      required: [joueur, moi, adversaire, actif, tour, issue, actions]
      properties:
        joueur: { type: string, enum: [j1, j2] }
        moi:
          allOf:
            - $ref: '#/components/schemas/Camp'
            - type: object
              required: [main, aDecommissionne, marqueurs]
              properties:
                main: { type: array, items: { $ref: '#/components/schemas/CarteEnMain' } }
                aDecommissionne: { type: boolean }
                marqueurs: { $ref: '#/components/schemas/Marqueurs' }
        adversaire:
          allOf:
            - $ref: '#/components/schemas/Camp'
            - type: object
              required: [main]
              properties:
                main: { type: integer, description: Nombre de cartes en main (contenu caché). }
        actif: { type: string, enum: [j1, j2] }
        tour: { type: integer, description: Tour en cours, tous joueurs confondus (20 au plus). }
        issue:
          oneOf:
            - type: 'null'
            - type: object
              required: [gagnant, raison]
              properties:
                gagnant: { type: [string, 'null'], enum: [j1, j2, null] }
                raison:
                  type: string
                  enum: [sla, tours, abandon, forfait]
                  description: abandon et forfait ne concernent que les duels (US-036).
        actions:
          type: array
          description: Actions légales du joueur ; vide quand ce n'est pas son tour.
          items: { $ref: '#/components/schemas/Action' }
    Marqueurs:
      type: object
      description: >
        Usages « une fois par tour » et protections du joueur, qu'il est seul à voir (US-026).
      required:
        [
          fileDurableUtilisee,
          parade,
          siProtegeJusquAuTour,
          malusDebit,
          cronUtilise,
          delegationUtilisee,
          outillageUtilise,
          cacheUtilise,
          routageUtilise,
        ]
      properties:
        fileDurableUtilisee: { type: boolean }
        parade:
          { type: boolean, description: Le prochain incident joué contre ce joueur est sans effet. }
        siProtegeJusquAuTour:
          type: [integer, 'null']
          description: Le SI ne perd aucun SLA jusqu'à ce tour inclus (Circuit Breaker).
        malusDebit:
          { type: integer, description: Débit retiré au prochain tour (Facture de tokens). }
        cronUtilise: { type: boolean }
        delegationUtilisee: { type: boolean }
        outillageUtilise: { type: boolean }
        cacheUtilise: { type: boolean }
        routageUtilise: { type: boolean }
    Camp:
      type: object
      required: [sla, debit, tours, plateau, defausse, pioche]
      properties:
        sla: { type: integer }
        debit: { type: integer }
        tours: { type: integer }
        plateau: { type: array, items: { $ref: '#/components/schemas/Composant' } }
        defausse: { type: array, items: { $ref: '#/components/schemas/Instance' } }
        pioche: { type: integer, description: Nombre de cartes restantes. }
    Instance:
      type: object
      required: [id, numero]
      properties:
        id: { type: string, description: Identifiant de la carte dans la partie. }
        numero: { type: integer, description: Numéro de la carte du catalogue. }
    CarteEnMain:
      allOf:
        - $ref: '#/components/schemas/Instance'
        - type: object
          properties:
            injouable:
              type: [string, 'null']
              description: >
                Pourquoi cette carte ne se joue pas maintenant (US-071), null si une action la joue (poser, evoluer,
                jouer, migrer, router ; décommissionner ne compte pas). Par ordre de priorité : pas votre tour, carte
                pas encore prise en charge, évolution sans sa carte d'origine sur le plateau, plateau plein, Débit
                insuffisant (coût effectif), aucune cible possible. Absent une fois la partie terminée.
              examples:
                - Évolution d’Apigee API Gateway: posez d’abord Apigee API Gateway, puis faites-la évoluer.
                - Il vous faut 5 Débit, vous en avez 3.
    Composant:
      allOf:
        - $ref: '#/components/schemas/Instance'
        - type: object
          required: [pv, attaque, poseAuTour, aAttaqueCeTour]
          properties:
            pv: { type: integer }
            attaque: { type: integer, description: Attaque effective (bonus de Hub compris). }
            poseAuTour: { type: integer }
            aAttaqueCeTour: { type: boolean }
            dernierTourAttaque: { type: [integer, 'null'] }
            attaquesSubies: { type: integer }
            reactifUtilise: { type: boolean }
            entretienImpaye: { type: boolean }
            bonusAttaque:
              { type: integer, description: Bonus d'attaque permanent (Prompt système, Few-shot). }
            immobiliseJusquAuTour:
              type: [integer, 'null']
              description: Ne peut pas attaquer jusqu'à ce tour inclus (Rate limiting, Timeout…).
            sansCapacitesJusquAuTour:
              type: [integer, 'null']
              description: Capacités suspendues jusqu'à ce tour inclus (Certificat expiré, Contexte saturé).
            doublon: { type: boolean, description: Le prochain dégât subi est doublé. }
            attaqueNulle:
              { type: boolean, description: La prochaine attaque n'inflige aucun dégât. }
            coupleA: { type: [string, 'null'], description: Composant lié par Couplage fort. }
            delegue:
              { type: boolean, description: A déjà attaqué une seconde fois ce tour (Délégation). }
            capacitesEmpruntees:
              type: array
              items: { type: string }
              description: Capacités empruntées par Outillage jusqu'à la fin du tour.
            sansAttaque:
              type: [string, 'null']
              description: >
                Pourquoi ce composant ne peut pas attaquer maintenant (US-041), null s'il le peut. Seulement sur ses
                propres composants, pendant son tour ; absent sinon.
    Action:
      oneOf:
        - type: object
          required: [type, carte]
          properties:
            type: { const: poser }
            carte: { type: string }
            cible:
              type: string
              description: >
                Composant renforcé par OpenAPI ou AsyncAPI (+1 attaque), obligatoire quand la carte a une cible
                possible (US-019).
        - type: object
          required: [type, carte, origine]
          properties:
            type: { const: evoluer }
            carte: { type: string }
            origine: { type: string }
        - type: object
          required: [type, carte]
          properties:
            type: { const: decommissionner }
            carte: { type: string }
        - type: object
          required: [type, attaquant, cible]
          properties:
            type: { const: attaquer }
            attaquant: { type: string }
            cible: { type: string, description: Identifiant d'un composant adverse, ou `si`. }
        - type: object
          required: [type, carte, cibles]
          description: Joue un sort ou un incident (US-014).
          properties:
            type: { const: jouer }
            carte: { type: string }
            cibles:
              type: array
              maxItems: 3
              description: >
                Cibles dans l'ordre attendu par la carte : identifiants de composants, d'une carte de la défausse
                (Dead Letter Queue), ou `si`. Vide pour une carte sans cible.
              items: { type: string }
        - type: object
          required: [type, source]
          description: Outillage — vos agents empruntent les capacités de ce composant non IA (US-020).
          properties:
            type: { const: outiller }
            source: { type: string }
        - type: object
          required: [type, retour, carte]
          description: Routage multi-modèles — renvoie `retour` en main et pose gratuitement `carte` (US-020).
          properties:
            type: { const: router }
            retour: { type: string }
            carte: { type: string }
        - type: object
          required: [type, source, carte]
          description: Migration — remplace `source` (SFTP) par `carte`, 2 Débit moins cher (US-020).
          properties:
            type: { const: migrer }
            source: { type: string }
            carte: { type: string }
        - type: object
          required: [type]
          properties:
            type: { const: finirTour }
    Conseil:
      type: object
      required: [version, action, explication]
      properties:
        version:
          type: integer
          description: La version de la partie pour laquelle le conseil vaut.
        action: { $ref: '#/components/schemas/Action' }
        explication:
          type: string
          description: Pourquoi ce coup, en une phrase de joueur.
          examples:
            - 'Attaquez Adaptateur SAP avec LLM : il a Garde et protège le SI ; votre LLM le détruit et survit à sa riposte.'
    Evenement:
      type: object
      required: [type]
      description: >
        Un événement du journal : debut-tour, pioche, carte-brulee, pose, evolution, decommission, attaque, degats,
        destruction, retour-main, entretien, supervision, jeu, parade, statut, rappel, si-protege, outillage,
        routage, migration, fin-partie. Ses autres champs dépendent du type
        (packages/domain/src/combat/types.ts).
      properties:
        type: { type: string }
      additionalProperties: true
    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          { type: string, description: Code de refus d'une action (ex. debit-insuffisant, garde). }
