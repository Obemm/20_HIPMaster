openapi: 3.1.0
info:
  title: HIPMaster — duels entre joueurs
  version: 1.2.0
  description: >
    Duels asynchrones, au tour par tour, entre deux comptes (US-032, ADR 0020). Le serveur tient l'état complet du
    moteur et ne renvoie à chacun que sa vue. Le créateur d'un duel le lance avec son deck ; un autre joueur le
    rejoint avec le sien, et le tirage désigne qui commence. Compte requis (`Authorization: Bearer <jeton>`, voir
    comptes.yaml). Les schémas `Vue`, `Action` et `Evenement` sont ceux de parties.yaml : la vue dit aussi pourquoi
    une carte de la main ne se joue pas (`injouable`, US-071), y compris pendant le tour de l'adversaire.

    Protections (US-047, ADR 0025) : chaque route est limitée par adresse IP (valeurs de production dans sa
    description, multipliées par le réglage `LIMITES_DEBIT` de l'API), 429 avec `Retry-After` au-delà ; réponses en
    `Cache-Control: no-store` ; corps de 16 Ko au plus (413).
servers:
  - url: /api/v1
security: [{ jeton: [] }]
paths:
  /duels:
    post:
      operationId: creerDuel
      summary: Crée un duel en attente d'adversaire
      description: 'Limite : 60 duels par heure et par adresse.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck]
              properties:
                deck: { type: string, description: Identifiant d'un deck prêté (voir GET /decks). }
      responses:
        '201':
          description: Le duel, en attente d'adversaire.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '401': { $ref: '#/components/responses/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '422': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /duels/hasard:
    post:
      operationId: chercherAdversaire
      summary: Adversaire au hasard (US-037)
      description: >
        Rejoint le plus ancien duel ouvert d'un autre joueur (en évitant, si possible, le dernier adversaire) : le
        duel commence (200). S'il n'y en a pas, ouvre un duel et place le joueur dans la file (201) ; un joueur
        déjà dans la file y garde sa place. Les défis privés (lien, POST /duels) ne sont jamais proposés. Limite : 60
        recherches par heure et par adresse.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck]
              properties:
                deck: { type: string }
      responses:
        '200':
          description: Duel rejoint, il commence.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '201':
          description: Duel ouvert, en attente d'un adversaire.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '401': { $ref: '#/components/responses/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '422': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /duels/{id}:
    parameters: [{ $ref: '#/components/parameters/IdDuel' }]
    get:
      operationId: lireDuel
      summary: Le duel vu par le joueur qui demande
      description: >
        Un participant reçoit sa vue et les événements visibles depuis l'index `depuis` du journal. Un autre joueur
        ne voit qu'un duel en attente (qui défie, avec quel deck), pour pouvoir le rejoindre ; un duel commencé lui
        reste introuvable. Avec `If-None-Match` égal à l'ETag connu, la réponse est 304 si rien n'a changé. Limite :
        600 lectures par minute et par adresse.
      parameters:
        - name: depuis
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
          description: Index du journal à partir duquel renvoyer les événements (`curseur` d'une réponse précédente).
        - name: If-None-Match
          in: header
          schema: { type: string }
      responses:
        '200':
          description: Le duel.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '304': { description: Rien n'a changé depuis l'ETag fourni. }
        '401': { $ref: '#/components/responses/Probleme' }
        '404': { $ref: '#/components/responses/Probleme' }
        '410':
          description: Défi non accepté depuis plus de 7 jours (US-033).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
    delete:
      operationId: annulerDuel
      summary: Annule un défi pas encore accepté (créateur seulement, US-033)
      description: 'Limite : 300 requêtes par minute et par adresse.'
      responses:
        '204': { description: Défi annulé. }
        '401': { $ref: '#/components/responses/Probleme' }
        '404': { $ref: '#/components/responses/Probleme' }
        '409':
          description: Le duel a déjà commencé (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /duels/{id}/rejoindre:
    parameters: [{ $ref: '#/components/parameters/IdDuel' }]
    post:
      operationId: rejoindreDuel
      summary: Rejoint un duel en attente avec son deck ; le duel commence
      description: 'Limite : 300 requêtes par minute et par adresse.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deck]
              properties:
                deck: { type: string }
      responses:
        '200':
          description: Le duel commencé.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '401': { $ref: '#/components/responses/Probleme' }
        '404': { $ref: '#/components/responses/Probleme' }
        '409':
          description: Duel déjà commencé, ou c'est son propre duel (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '410':
          description: Défi non accepté depuis plus de 7 jours.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '422': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /duels/{id}/abandon:
    parameters: [{ $ref: '#/components/parameters/IdDuel' }]
    post:
      operationId: abandonnerDuel
      summary: Abandonne un duel en cours ; l'adversaire gagne (US-036)
      description: 'Limite : 300 requêtes par minute et par adresse.'
      responses:
        '200':
          description: Le duel terminé.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '401': { $ref: '#/components/responses/Probleme' }
        '404': { $ref: '#/components/responses/Probleme' }
        '409':
          description: Le duel n'a pas commencé, ou il est déjà terminé (Problem Details).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /duels/{id}/actions:
    parameters: [{ $ref: '#/components/parameters/IdDuel' }]
    post:
      operationId: jouerActionDuel
      summary: Joue une action, à son tour seulement
      description: >
        Avec `If-Match` égal à l'ETag connu, l'action est refusée (409) si le duel a changé entre-temps. La réponse
        contient les événements visibles produits par l'action. Limite : 300 actions par minute et par adresse.
      parameters:
        - name: If-Match
          in: header
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: 'parties.yaml#/components/schemas/Action' }
      responses:
        '200':
          description: Le duel après l'action.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Duel' }
        '401': { $ref: '#/components/responses/Probleme' }
        '404': { $ref: '#/components/responses/Probleme' }
        '409':
          description: Ce n'est pas votre tour, le duel n'a pas commencé, ou il a changé depuis l'ETag fourni.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Probleme' }
        '413': { $ref: '#/components/responses/Probleme' }
        '422': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
  /moi/duels:
    get:
      operationId: lireMesDuels
      summary: Les duels du joueur connecté, ceux qui attendent son tour en premier (US-035)
      description: >
        Ordre : à mon tour, au tour de l'adversaire, défis en attente d'adversaire, puis les 20 derniers duels
        terminés ; dans chaque groupe, le plus récemment joué d'abord. `aMonTour` compte les duels qui attendent le
        joueur. Limite : 600 lectures par minute et par adresse.
      responses:
        '200':
          description: Les duels.
          content:
            application/json:
              schema:
                type: object
                required: [aMonTour, duels]
                properties:
                  aMonTour: { type: integer, minimum: 0 }
                  duels:
                    type: array
                    items: { $ref: '#/components/schemas/ResumeDuel' }
        '401': { $ref: '#/components/responses/Probleme' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
components:
  securitySchemes:
    jeton:
      type: http
      scheme: bearer
  parameters:
    IdDuel:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  headers:
    ETag:
      description: Version du duel, entre guillemets ; elle change à chaque action et à chaque changement de statut.
      schema: { type: string, examples: ['"3"'] }
  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TropDeRequetes: { $ref: 'comptes.yaml#/components/responses/TropDeRequetes' }
  schemas:
    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
    Duel:
      type: object
      required:
        [
          id,
          statut,
          version,
          createur,
          deckCreateur,
          ouvert,
          adversaire,
          moi,
          curseur,
          echeance,
          vue,
          evenements,
        ]
      properties:
        id: { type: string, format: uuid }
        statut: { type: string, enum: [attente, en-cours, termine] }
        version: { type: integer }
        createur: { $ref: '#/components/schemas/Participant' }
        deckCreateur: { type: string }
        ouvert:
          type: boolean
          description: Duel ouvert à tous (adversaire au hasard, US-037) ; sinon défi privé, rejoint par son lien.
        adversaire:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Participant'
        moi:
          type: [string, 'null']
          enum: [j1, j2, null]
          description: Le camp du joueur qui demande ; null s'il ne participe pas.
        curseur: { type: integer, description: Longueur du journal, à repasser dans `depuis`. }
        echeance:
          type: [string, 'null']
          format: date-time
          description: >
            Duel en cours : instant limite du coup attendu (72 h après le dernier coup). Au-delà, le joueur actif
            perd par forfait, évalué à la lecture (US-036).
        vue:
          description: La vue du joueur qui demande ; null tant que le duel n'a pas commencé ou pour un non-participant.
          oneOf:
            - type: 'null'
            - $ref: 'parties.yaml#/components/schemas/Vue'
        evenements:
          type: array
          items: { $ref: 'parties.yaml#/components/schemas/Evenement' }
        recompense:
          type: object
          description: >
            Présente quand le joueur qui demande a gagné le duel (US-038) : un booster, dans le même plafond quotidien
            que les victoires contre le bot, une seule fois par duel. Une victoire par abandon ou forfait ne rapporte
            rien contre un adversaire déjà affronté le même jour (UTC).
          required: [booster, plafondAtteint, motif]
          properties:
            booster: { type: boolean }
            plafondAtteint: { type: boolean }
            motif:
              type: [string, 'null']
              enum: [plafond, adversaire-deja-affronte, null]
              description: Sans booster, pourquoi.
    Participant:
      type: object
      required: [pseudo]
      properties:
        pseudo: { type: string }
    ResumeDuel:
      type: object
      required: [id, statut, adversaire, monTour, tour, resultat, raison, majLe, echeance]
      properties:
        id: { type: string, format: uuid }
        statut: { type: string, enum: [attente, en-cours, termine] }
        adversaire:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/Participant'
        monTour: { type: boolean, description: Le duel attend une action du joueur. }
        tour:
          {
            type: [integer, 'null'],
            description: Tour en cours ; null tant que le duel n'a pas commencé.,
          }
        resultat:
          type: [string, 'null']
          enum: [victoire, defaite, nulle, null]
          description: Pour un duel terminé, du point de vue du joueur.
        raison:
          type: [string, 'null']
          enum: [sla, tours, abandon, forfait, null]
          description: Pour un duel terminé, comment il s'est fini.
        majLe:
          { type: string, format: date-time, description: Dernier coup joué (ou création du défi). }
        echeance:
          type: [string, 'null']
          format: date-time
          description: Pour un duel en cours, instant limite du coup attendu.
