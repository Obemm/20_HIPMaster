# Base PostgreSQL de développement : `docker compose up -d`
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hipmaster
      POSTGRES_PASSWORD: hipmaster
      POSTGRES_DB: hipmaster
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hipmaster']
      interval: 5s
      retries: 10

volumes:
  pgdata:
